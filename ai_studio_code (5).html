<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Money - God Mode Admin</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #0b0f19; color: #f8fafc; }
        .glass { background: rgba(17, 25, 40, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; }
        .tab-btn { padding: 12px 24px; border-radius: 16px; font-weight: 700; transition: 0.3s; color: #64748b; font-size: 13px; white-space: nowrap; }
        .tab-btn.active { background: #6366f1; color: white; box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3); }
        input, textarea, select { background: #161d2f !important; color: white !important; border: 1px solid #2d3748 !important; border-radius: 16px !important; padding: 14px !important; outline: none; margin-bottom: 15px; width: 100%; }
        .section { display: none; animation: slideIn 0.4s ease; }
        .section.active { display: block; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #auth-screen { position: fixed; inset: 0; background: #0b0f19; z-index: 100000; display: flex; align-items: center; justify-content: center; }
        .req-card { border-left: 5px solid #6366f1; }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- LOGIN SCREEN (Password: 258025) -->
    <div id="auth-screen">
        <div class="glass p-10 w-full max-w-sm text-center">
            <div class="w-20 h-20 bg-indigo-600/20 text-indigo-500 rounded-3xl flex items-center justify-center mx-auto mb-6 text-3xl shadow-inner"><i class="fas fa-unlock-alt"></i></div>
            <h2 class="text-2xl font-black mb-6 uppercase tracking-tighter italic">Admin Portal</h2>
            <input type="password" id="admin-pass" placeholder="Password (258025)">
            <button onclick="login()" class="w-full bg-indigo-600 py-4 rounded-2xl font-bold hover:bg-indigo-700 transition-all shadow-lg">LOGIN</button>
        </div>
    </div>

    <div id="main-panel" class="hidden max-w-7xl mx-auto">
        <!-- TOP STATS -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-black italic uppercase text-white">Cash Money <span class="text-indigo-500">Admin</span></h1>
                <p class="text-[10px] font-bold text-slate-500 tracking-[5px]">MASTER CONTROL PANEL</p>
            </div>
            <div class="flex gap-4">
                <div class="glass px-6 py-4 text-center border-b-4 border-indigo-500">
                    <p class="text-[10px] font-bold text-slate-400 uppercase">Users</p>
                    <h3 id="stat-users" class="text-xl font-black">0</h3>
                </div>
                <div class="glass px-6 py-4 text-center border-b-4 border-green-500">
                    <p class="text-[10px] font-bold text-slate-400 uppercase">Assets</p>
                    <h3 id="stat-bal" class="text-xl font-black text-green-400">৳ 0</h3>
                </div>
            </div>
        </header>

        <!-- TABS -->
        <div class="flex gap-2 overflow-x-auto mb-8 pb-2 no-scrollbar">
            <button onclick="showTab('requests', this)" class="tab-btn active">REQUESTS</button>
            <button onclick="showTab('broadcast', this)" class="tab-btn">SEND MESSAGE</button>
            <button onclick="showTab('userlist', this)" class="tab-btn">USER LIST</button>
            <button onclick="showTab('packages', this)" class="tab-btn">PACKAGES</button>
            <button onclick="showTab('jobs', this)" class="tab-btn">MICROJOBS</button>
            <button onclick="showTab('settings', this)" class="tab-btn">APP SETTINGS</button>
            <button onclick="showTab('admin-access', this)" class="tab-btn text-amber-400">ADMINS</button>
        </div>

        <!-- 1. REQUESTS SECTION -->
        <div id="requests" class="section active">
            <div id="requests-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>

        <!-- 2. BROADCAST -->
        <div id="broadcast" class="section">
            <div class="glass p-8 max-w-2xl mx-auto text-center">
                <h3 class="text-xl font-bold mb-4 italic">Broadcast Message to All</h3>
                <textarea id="bc-msg" rows="5" placeholder="সালাম দোস্ত! মেসেজ লেখ..."></textarea>
                <button onclick="sendBroadcast()" class="w-full bg-indigo-600 py-4 rounded-2xl font-black uppercase">Send Alert to All</button>
            </div>
        </div>

        <!-- 3. USER LIST -->
        <div id="userlist" class="section">
            <div class="glass overflow-hidden"><table class="w-full text-left"><thead class="bg-indigo-600/10 text-slate-400 text-[10px] font-bold uppercase"><tr><th class="p-4">UID</th><th class="p-4">Balance</th><th class="p-4">Plans</th><th class="p-4">Action</th></tr></thead><tbody id="user-rows"></tbody></table></div>
        </div>

        <!-- 4. PACKAGES -->
        <div id="packages" class="section">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="glass p-8">
                    <h3 class="font-bold mb-6 italic text-indigo-400">Add Investment Plan</h3>
                    <input type="text" id="p-title" placeholder="Plan Name">
                    <input type="number" id="p-price" placeholder="Price (৳)">
                    <input type="number" id="p-daily" placeholder="Daily Earn (৳)">
                    <input type="number" id="p-days" placeholder="Validity (Days)">
                    <button onclick="addPkg()" class="w-full bg-indigo-600 py-4 rounded-xl font-bold">PUBLISH PLAN</button>
                </div>
                <div id="pkg-admin-list" class="space-y-4"></div>
            </div>
        </div>

        <!-- 5. MICROJOBS -->
        <div id="jobs" class="section">
            <div class="glass p-8 mb-8">
                <h3 class="font-bold mb-6 italic text-indigo-400">Create Task</h3>
                <input type="text" id="j-title" placeholder="Job Title">
                <input type="number" id="j-amt" placeholder="Reward (৳)">
                <textarea id="j-desc" placeholder="Step-by-step instructions..."></textarea>
                <button onclick="addJob()" class="w-full bg-indigo-600 py-4 rounded-xl font-bold">POST JOB</button>
            </div>
            <div id="job-admin-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>

        <!-- 6. APP SETTINGS (FIXED MIN LIMITS) -->
        <div id="settings" class="section">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="glass p-8">
                    <h3 class="font-bold mb-6 text-indigo-400 uppercase text-xs tracking-widest">Global Notice & Limits</h3>
                    <label class="text-[10px] font-bold text-slate-500">HOME BANNER TEXT</label><input type="text" id="s-banner">
                    <label class="text-[10px] font-bold text-slate-500">BELL NOTIFICATION</label><textarea id="s-notice" rows="3"></textarea>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="text-[10px] font-bold text-indigo-400 uppercase">Min Deposit (৳)</label><input type="number" id="s-min-depo"></div>
                        <div><label class="text-[10px] font-bold text-indigo-400 uppercase">Min Withdraw (৳)</label><input type="number" id="s-min-withdraw"></div>
                    </div>
                </div>
                <div class="glass p-8">
                    <h3 class="font-bold mb-6 text-indigo-400 uppercase text-xs tracking-widest">Payment Methods</h3>
                    <label class="text-[10px] font-bold text-slate-500">BKASH</label><input type="text" id="s-bkash">
                    <label class="text-[10px] font-bold text-slate-500">NAGAD</label><input type="text" id="s-nagad">
                    <label class="text-[10px] font-bold text-slate-500">ROCKET</label><input type="text" id="s-rocket">
                    <label class="text-[10px] font-bold text-slate-500">GMAIL PASS</label><input type="text" id="s-gpass">
                </div>
            </div>
            <button onclick="saveSets()" class="w-full bg-indigo-600 py-5 rounded-2xl font-black mt-6 shadow-2xl active:scale-95 transition-transform">SAVE ALL APP SETTINGS</button>
        </div>

        <!-- 7. ADMIN ACCESS -->
        <div id="admin-access" class="section">
            <div class="glass p-8 max-w-xl mx-auto text-center">
                <h3 class="font-bold mb-4 uppercase italic">Authorize Secondary Admin</h3>
                <input type="number" id="new-admin-uid" placeholder="Enter Telegram UID">
                <button onclick="addAdmin()" class="w-full bg-amber-500 text-black py-4 rounded-xl font-bold mt-2">GRANT ACCESS</button>
                <div id="admin-list-container" class="mt-8 space-y-3"></div>
            </div>
        </div>
    </div>

    <script>
        // --- Firebase Config (Same as App) ---
        const firebaseConfig = {
            apiKey: "AIzaSyBOXjOvNwx fbiT7k_h5",
            authDomain: "sell-14df3.firebaseapp.com",
            databaseURL: "https://sell-14df3-default-rtdb.firebaseio.com",
            projectId: "sell-14df3",
            storageBucket: "sell-14df3.appspot.com",
            messagingSenderId: "694027361200",
            appId: "1:694027361200:web:55533a38ec919248787924"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function login() { 
            const p = document.getElementById('admin-pass').value;
            if(p === "258025") { 
                document.getElementById('auth-screen').style.display = 'none'; 
                document.getElementById('main-panel').classList.remove('hidden'); 
                initPanel(); 
            } else alert("Wrong Password!"); 
        }

        function initPanel() {
            // Stats & Users
            database.ref('users').on('value', snap => {
                const users = snap.val() || {};
                document.getElementById('stat-users').innerText = Object.keys(users).length;
                let total = 0, rows = "";
                Object.keys(users).forEach(uid => { 
                    total += (users[uid].balance || 0); 
                    rows += `<tr class="user-row border-b border-white/5 font-bold text-xs"><td class="p-4">${uid}</td><td class="p-4 text-green-400">৳${(users[uid].balance || 0).toFixed(2)}</td><td class="p-4">${users[uid].activePlans ? Object.keys(users[uid].activePlans).length : 0} Plans</td><td class="p-4"><button onclick="editUser('${uid}', ${users[uid].balance || 0})" class="bg-indigo-600/20 px-3 py-1 rounded text-indigo-400">Fix</button></td></tr>`; 
                });
                document.getElementById('stat-bal').innerText = "৳ " + total.toFixed(2);
                document.getElementById('user-rows').innerHTML = rows;
            });

            // Requests List
            database.ref('requests').on('value', snap => {
                const container = document.getElementById('requests-container'); const reqs = snap.val(); container.innerHTML = ""; if(!reqs) return;
                Object.keys(reqs).reverse().forEach(k => { 
                    const r = reqs[k]; 
                    if(r.status === 'PENDING') { 
                        let info = r.type === 'Withdraw' ? `NUMBER: <b class="text-white">${r.number}</b>` : (r.type === 'Deposit' ? `TRX: ${r.trx}` : `MAIL: ${r.mail}`);
                        let img = r.screenshot ? `<img src="${r.screenshot}" class="w-full rounded-xl mt-4 border border-slate-700 cursor-zoom-in" onclick="window.open('${r.screenshot}')">` : '';
                        container.innerHTML += `<div class="glass p-6 req-card"><span class="bg-indigo-600 text-white text-[10px] px-3 py-1 rounded-full font-black uppercase">${r.type}</span><h3 class="text-2xl font-black mt-3">৳${r.amt}</h3><p class="text-xs text-slate-400 mb-2">UID: ${r.uid}</p><p class="text-[11px] text-indigo-300 font-mono bg-white/5 p-3 rounded-lg leading-relaxed">${info}</p>${img}<div class="flex gap-2 mt-6"><button onclick="handleReq('${k}', '${r.uid}', ${r.amt}, 'SUCCESS', '${r.type}')" class="flex-1 bg-green-600 py-3 rounded-xl font-bold uppercase text-[10px]">Approve</button><button onclick="handleReq('${k}', '${r.uid}', ${r.amt}, 'REJECTED', '${r.type}')" class="flex-1 bg-red-600 py-3 rounded-xl font-bold uppercase text-[10px]">Reject & Refund</button></div></div>`;
                    } 
                });
            });

            // Settings Load (FIXED: Added min_depo/min_withdraw load)
            database.ref('settings').once('value', s => {
                const d = s.val() || {};
                document.getElementById('s-banner').value = d.signboard || "";
                document.getElementById('s-notice').value = d.notice || "";
                document.getElementById('s-gpass').value = d.gpass || "";
                document.getElementById('s-bkash').value = d.bkash || "";
                document.getElementById('s-nagad').value = d.nagad || "";
                document.getElementById('s-rocket').value = d.rocket || "";
                document.getElementById('s-min-depo').value = d.min_depo || 0;
                document.getElementById('s-min-withdraw').value = d.min_withdraw || 0;
            });
            loadLists();
        }

        // Handle Approved/Rejected
        function handleReq(k, uid, amt, status, type) {
            database.ref('requests/' + k).update({ status: status }).then(() => {
                if(status === 'SUCCESS' && (type === 'Deposit' || type === 'Gmail' || type === 'Microjob')) {
                    database.ref('users/' + uid + '/balance').transaction(c => (c || 0) + parseFloat(amt));
                }
                else if(status === 'REJECTED' && type === 'Withdraw') {
                    database.ref('users/' + uid + '/balance').transaction(c => (c || 0) + parseFloat(amt));
                }
                alert(`Request ${status}!`);
            });
        }

        // Save Global Settings (FIXED: Added min_depo/min_withdraw save)
        function saveSets() { 
            const data = { 
                signboard: document.getElementById('s-banner').value, 
                notice: document.getElementById('s-notice').value, 
                gpass: document.getElementById('s-gpass').value, 
                bkash: document.getElementById('s-bkash').value, 
                nagad: document.getElementById('s-nagad').value, 
                rocket: document.getElementById('s-rocket').value,
                min_depo: parseFloat(document.getElementById('s-min-depo').value) || 0,
                min_withdraw: parseFloat(document.getElementById('s-min-withdraw').value) || 0
            }; 
            database.ref('settings').update(data).then(() => alert("App Synchronized Successfully!")); 
        }

        // Support functions
        function editUser(u, b) { let n = prompt("New Balance:", b); if(n) database.ref('users/'+u).update({ balance: parseFloat(n) }); }
        function addPkg() { database.ref('packages/' + Date.now()).set({ title: document.getElementById('p-title').value, price: parseFloat(document.getElementById('p-price').value), daily: parseFloat(document.getElementById('p-daily').value), days: parseInt(document.getElementById('p-days').value) }).then(() => alert("Plan Added!")); }
        function addJob() { database.ref('microjobs/' + Date.now()).set({ title: document.getElementById('j-title').value, amt: parseFloat(document.getElementById('j-amt').value), desc: document.getElementById('j-desc').value }).then(() => alert("Job Posted!")); }
        function sendBroadcast() { const m = document.getElementById('bc-msg').value; if(m) database.ref('broadcast').set({ msg: m, time: Date.now() }).then(() => { alert("Sent!"); document.getElementById('bc-msg').value = ""; }); }
        function addAdmin() { const u = document.getElementById('new-admin-uid').value; if(u) database.ref('admins/' + u).set(true).then(() => alert("Admin Added!")); }
        
        function loadLists() {
            database.ref('packages').on('value', snap => { const l = document.getElementById('pkg-admin-list'), d = snap.val(); l.innerHTML = ""; if(d) Object.keys(d).forEach(k => l.innerHTML += `<div class="glass p-4 flex justify-between"><div><b>${d[k].title}</b><p class="text-xs">৳${d[k].price}</p></div><button onclick="database.ref('packages/${k}').remove()" class="text-red-500"><i class="fas fa-trash"></i></button></div>`); });
            database.ref('microjobs').on('value', snap => { const l = document.getElementById('job-admin-list'), d = snap.val(); l.innerHTML = ""; if(d) Object.keys(d).forEach(k => l.innerHTML += `<div class="glass p-4 flex justify-between"><div><b>${d[k].title}</b><p class="text-xs">Reward: ৳${d[k].amt}</p></div><button onclick="database.ref('microjobs/${k}').remove()" class="text-red-500"><i class="fas fa-trash"></i></button></div>`); });
            database.ref('admins').on('value', snap => { const l = document.getElementById('admin-list-container'), d = snap.val(); l.innerHTML = ""; if(d) Object.keys(d).forEach(k => l.innerHTML += `<div class="glass p-4 flex justify-between"><span>UID: ${k}</span><button onclick="database.ref('admins/${k}').remove()" class="text-red-500"><i class="fas fa-user-minus"></i></button></div>`); });
        }
        function showTab(id, btn) { document.querySelectorAll('.section').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
    </script>
</body>
</html>
